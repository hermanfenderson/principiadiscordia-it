    scala_x: 0.94
    interlinea: 33
    x: 209
    y: 1050
    righe:
      - "    In risposta alla tua richiesta per un rilasciare un agitprop da inserirsi"
      - "nella prossima edizione dei PRINCIPIA, spero che quanto segue sia utile. E per"
      - "favore smetti di insistere con le tue lettere incessanti!"
  - font: CourierPrime-Bold.ttf
    corpo: 32
    scala_x: 0.94
    interlinea: 33
    x: 209
    y: 1173
    righe:
      - "    Episkopos Mordecai, Tenutario del Notariato Sojac (Keeper of the Notary"
      - "Sojac), mi informa che sei autorizzato a rilevare che i più antichi documenti"
      - "esistenti mostrano che eravamo già pienamente costituiti ad Atlantide, circa"
      - "18.000 anni prima di Cristo, sotto Kull, lo schiavo delle galere che era asceso"
      - "al Trono di Valusia. Fummo rifondati da Pelias di Koth, circa 10.000 anni prima"
      - "di Cristo. E' probabile che sia lui a trasmettere gli insegnamenti misterici a"
      - "Conan di Cimmeria dopo che Conan divenne re di Aquilonia. Essi furono portati"
      - "per primi da Conan nell'emisfero occidentale e insegnati ai sacerdoti Maya"
      - "(Conan è Quetzlcoatl). Ciò avvenne il 4 Ahua, 8 Cumhu, data Maya. Rifondati da"
      - "Abdul Alhazred nella famigerata Al Azif, circa nell'800 d.C. (Al Azif fu"
      - "tradotto in Latino da Olaus Wormius, 1132 d.C., come il Necronomicon.) Nel 1090"
      - "d.C. avvenne la fondazione della Setta Ismaeliana (Hashishim) da parte di Hassan"
      - "i Sabbah, con gli insegnamenti segreti basati su Alhazred, Pelias e Kull. La"
      - "fondazione degli Illuminati di Baviera, da parte di Adam Weishaupt, avvenne il 1"
      - "Maggio 1776 sulla base del lavoro degli altri. Weishaupt lo portò negli Stati"
      - "Uniti durante il periodo in cui impersonava George Washington; ed era lui l'uomo"
      - "in nero che fornì il disegno del Grande Sigillo a Jefferson in giardino quella"
      - "notte. La tradizione illuminata è ora, naturalmente, nelle mani della Antica"
      - "Setta degli Illuminati di Baviera (A.S.I.B.), con sede qui negli Stati Uniti."
  - font: CourierPrime-Bold.ttf
    corpo: 32
    scala_x: 0.94
    interlinea: 33
    x: 209
    y: 1824
    righe:
      - "    I nostri insegnamenti non sono, non credo ci sia bisogno di ricordartelo,"
      - "disponibili per la pubblicazione. Non credo di fare alcun danno nell'ammettere"
      - "che essi sono nascosti nel Finnegan's Wake di Joyce, nel Nova Express di"
      - "Burroughs, e nella traduzione di Re Giacomo della Sacra Bibbia (ma non nella"
      - "versione Latina o Ebraica), e nel Blue Book. Per non parlare degli scritti"
      - "privati di Ben Franklin (!), ma stiamo ancora tenendoli nascosti."
  - font: CourierPrime-Bold.ttf
    corpo: 32
    scala_x: 0.94
    interlinea: 33
    x: 209
    y: 2046
    righe:
      - "    Considerando gli accadimenti recenti--sai di ciò di cui sto parlando--si è"
      - "deciso di raccontare un po' di più delle nostre organizzazioni di facciata. La"
      - "tua pubblicazione è quindi tempestiva: quindi menziona che in aggiunta ai vecchi"
      - "fronti quali i Massoni, le Banche Rothchild, e il Federal Reserve System,"
      - "abbiamo ora un controllo rilevante sul Federal Bureau of Investigation (da"
      - "quando Hoover è morto lo scorso anno, ma questo è ancora un segreto), gli"
      - "Studenti per una Società Democratica, il Partito Comunista degli USA, la"
      - "Associazione Anarchica Americana, la Camera di Commercio giovanile, la Black"
      - "Lotus Society, il Partito Repubblicano, la Società \"John Dillinger è morto per"
