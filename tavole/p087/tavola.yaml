      - "sostenuta dai membri della John Birch Society, ovvero che stiamo cercando di"
      - "dominare il mondo; in questo modo non sarà rivelato che abbiamo completato in"
      - "genere il controllo economico e politico diverse generazioni fa e che stiamo"
      - "giocando un pochino col mondo finché la civilizzazione avanzi abbastanza per la"
