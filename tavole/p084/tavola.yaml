# Tavola p084 (originale 00069) — La Lettera ai Paranoici
# Pagina del vecchio sito: 76 (testo/it/76.md)
# STATO: completa
# NUOVE TRADUZIONI: timbro "EXECUTED" -> "GIUSTIZIATO" (sul vecchio sito restava
#   l'immagine inglese, senza traduzione). Come nell'originale esce dal margine destro
#   (si legge "GIUSTIZIAT..." come "EXECUTE...").
# DIFFERENZE: la nota manoscritta in fondo è la nota a piè di pagina di Mauro
#   ("*Nonostante esistano forti evidenze...") ricomposta al posto della scritta a mano.
#   Paragrafi del corpo distanziati di mezza riga invece di una riga intera, interlinea 58
#   (l'italiano è più lungo; il carattere e l'interlinea restano quelli dell'originale).
# REFUSI CORRETTI: "Mnistri" -> "Ministri"; "tribolazone" -> "tribolazione";
#   "avverrtimenti" -> "avvertimenti"; tolto il "!" dopo "apprezzato" (residuo della
#   posizione dell'immagine sul vecchio sito), messo il punto.
# NdT ESCLUSE: nessuna
# FONT: domande in Old Standard (tipografia scolastica con grazie); timbro in Oswald
#   pesante con effetto timbro; nota a mano in Kalam Bold.

