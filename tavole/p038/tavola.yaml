#   il numero 6-713, il triangolo con le fiamme, il pallino del riquadro e il numero di pagina.
# Font: corpo del modulo in Old Standard 49 + grassetto 1 (Bodoni da modulo); titolo Old Standard Bold
#   allargato (l'originale è un Bodoni "fat face", nessun font della cartella è altrettanto nero);
#   intestazione in Jost; timbri e riquadro in Courier Prime Bold. Il timbro sbiadito "PROPRIETÀ DEL
#   DIPARTIMENTO DI GEOLOGIA" è reso con effetto timbro: più leggibile dell'originale, quasi illeggibile.
# Timbro capovolto: "IL MITTENTE ASPETTA!" lettera per lettera sull'arco originale (cerchio di centro
#   (144, 1497) e raggio 1008), "Rispondi / via cavo" capovolto a 197,6 gradi (Herman: "Rispondi via cavo").
# Coordinate in pixel sulla scansione a 360 dpi (1827 x 2962).

