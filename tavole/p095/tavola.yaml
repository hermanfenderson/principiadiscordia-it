      - "    difesa, ma non riuscivo mai a conciliarla con l'ideale."
      - "    Alla fine ho rinunciato anche a quello. In realtà ho"
      - "    semplicemente rinunciato all'idealismo."

  - font: CourierPrime-Regular.ttf
