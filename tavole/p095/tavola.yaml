    interlinea: 44.5
    x: 125
    y: 1519
    righe:
      - "Malik:     Mal² una volta mi disse che il pacifismo era un"
      - "    dilemma. Se tutti fossero pacifisti, allora tutto sarebbe"
      - "    perfetto. Ma nessuno diventerà pacifista se non lo sono io"
      - "    per primo. Ma se io lo sono e qualcun altro no, allora"
      - "    resto fregato. Disse che in quella circostanza c'erano"
      - "    cinque possibilità. La prima era bombardare i contadini col"
      - "    napalm e la seconda era giustiziare i propri genitori. La"
      - "    terza era l'ipocrisia, la quarta la vigliaccheria e la"
      - "    quinta ingoiare il dilemma. Gli Zenarchici sono addestrati"
      - "    a ingoiare dilemmi."

