# Tavola p028 (originale 00013) — "Pulisciti il culo con ciò che è scritto" / Il Cielo è giù
# Pagina del vecchio sito: 20 (testo/it/20.md)
# STATO: completa
# NUOVE TRADUZIONI: "HBT; The Book of Predications, Chap. 19" -> "HBT; Il libro delle Predizioni,
#   Cap. 19" (in testo/it/20.md è rimasto in inglese; resa come in testo/it/14.md)
# DIFFERENZE: scritta verticale da storico/immagini-it/FirmBelief.png ("E' MIO FERMO CONVINCIMENTO
#   CHE SIA UN ERRORE AVERE FERMI CONVINCIMENTI"); nuvola da storico/immagini-it/Ignotum.png
#   ("*Il significato di ciò è sconosciuto"; "IGNOTUM PER IGNOTIUS" è latino e resta com'è); l'uccellino accanto al
#   numero di pagina (ScratchyBird) non ha testo e resta com'è.
# REFUSI CORRETTI: nessuno
# NdT ESCLUSE: nessuna
# Poesia in Courier Prime Bold (l'originale è un Courier carico, passo 30).
# Coordinate in pixel sulla scansione a 360 dpi (1827 x 2962).

