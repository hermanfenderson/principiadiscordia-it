    x: 100
    y: 564
    righe:
      - "Un serio, giovane uomo provava confusione nei"
      - "conflitti dell'America della metà del ventesimo"
      - "secolo. Era andato da molte persone cercando una"
      - "maniera di risolvere in sé i fatti discordanti che lo"
      - "turbavano, ma questi turbamenti rimanevano."
      - "     Una notte in un caffè, un Maestro Zen"
      - "auto-ordinato gli disse: \"vai al palazzo fatiscente"
      - "che si trova all'indirizzo che ho scritto qui per te."
      - "Non parlare a coloro che ci vivono: dovrai rimanere in"
      - "silenzio finché la luna non sorgerà domani notte. Vai"
      - "nella grande stanza sulla destra dell'atrio"
      - "principale, siedi nella posizione del loto sui detriti"
      - "dell'angolo a nord-est, faccia al muro, e medita\"."
      - "     Egli fece proprio come il Maestro Zen aveva"
      - "ordinato. La sua meditazione fu frequentemente"
      - "interrotta da preoccupazioni. Si preoccupò del fatto"
      - "che il resto delle tubature del bagno del secondo"
      - "piano potesse cadergli addosso per unirsi ai tubi e"
      - "agli altri rottami su cui sedeva. Si preoccupò di come"
      - "avrebbe fatto a sapere quando la luna sarebbe sorta la"
      - "notte successiva. Si preoccupò di cosa le persone che"
      - "passavano per la stanza avrebbero detto di lui. Le sue"
      - "preoccupazioni e la sua meditazione furono disturbate"
      - "quando, come se la sua fede dovesse essere messa alla"
      - "prova, liquami caddero dal secondo piano su di lui. In"
      - "quel mentre, due persone entrarono nella stanza. La"
      - "prima chiese alla seconda chi fosse l'uomo seduto lì."
      - "Il secondo rispose: \"alcuni dicono che sia un"
      - "sant'uomo. Altri dicono che è una testa di cazzo\"."
      - "     Ascoltando questo, l'uomo fu illuminato."

