# REVISIONE: (a) riquadro gotico centrato sul riquadro (y 1580) con adatta 1000, cancellati i residui di discendenti tra cancellatura e filetto; (b) cancellata la F ornata, i bordi alti della prima riga e il punto di "scheme.", "Faccia a faccia..." ricomposto intero in Old Standard corpo 43 sulle basi originali (1003/963/922); (c) "in un" spostato alla terza riga ("in un Solo Fine Settimana!") lontano dalla fiamma, cancellato il punto della i di "Single"; (d) colonna IGIENE / OPERA LIRICA iniziata a y 1614 (adatta 842) per staccarla dai raggi tagliati. Scritte bianche non toccate.
# Tavola p092 (senza numero; IV edizione) — Le Parole degli Illuminati (collage, stampato ruotato)
# Pagina del vecchio sito: 84 (testo/it/84.md: solo l'immagine originale WordsoftheIllumined.gif)
# STATO: completa (scritte bianche su nero composte in revisione)
#   IMPORTANT GUIDE IN YOUR LIFE!" e l'avvertenza "WARNING! ...") restano in inglese: componi.py
#   compone solo inchiostro nero e non si possono cancellare senza distruggere il fondo. Traduzioni
#   pronte per il ritocco a mano: "QUESTA POTREBBE ESSERE / LA GUIDA PIÙ IMPORTANTE / DELLA TUA VITA!";
#   "ATTENZIONE! L'uso prolungato in una stanza buia può indurre allucinazioni o provocare effetti
#   collaterali indesiderati. Non usare in presenza di persone soggette a epilessia."
# NUOVE TRADUZIONI (tutte da rivedere; la pagina non era mai stata tradotta):
#   "The Words of the Illumined" -> "Le Parole degli Illuminati"; "WHY ARE WE HERE?" -> "PERCHÉ SIAMO
#   QUI?"; "Have you ever secretly wondered why the Great Pyramid has five sides — counting the
#   bottom?" -> "Ti sei mai chiesto in segreto perché la Grande Piramide ha cinque lati — contando la
#   base?"; POWER / VISION / KNOWLEDGE -> POTERE / VISIONE / CONOSCENZA; "Yes, I'd Like To Know the Five
#   Simple Actions that Will Turn Me Into a "Mental Wizard" in a Single Weekend!" -> "Sì, Voglio
#   Conoscere le Cinque Semplici Azioni che Mi Trasformeranno in un "Mago Mentale" in un Solo Fine
#   Settimana!"; "RATED (X)...NATURALLY" -> "VIETATO (X)...NATURALMENTE"; "SUPPRESSED KNOWLEDGE" ->
#   "CONOSCENZA SOPPRESSA"; "HYGIENE" -> "IGIENE"; "GRAND OPERA" -> "OPERA LIRICA"; citazioni bibliche
#   (1 Re 14,10 e Isaia 16,11) tradotte qui dalla versione inglese di Re Giacomo, non da una Bibbia
#   italiana ("Kirharesh" -> "Kir-Heres"); "Face to face with the mighty forces..." -> "Faccia a faccia
#   con le possenti forze e gli elementi della natura, l'uomo riflessivo contempla senza paura il suo
#   posto nel grande schema cosmico." (la F iniziale ornata è cancellata e ricomposta nel testo);
#   "— THE GODDESS ERIS PREVAILS —" -> "— LA DEA ERIS PREVALE —".
# DIFFERENZE: il riquadro gotico usa il titolo italiano di testo/it/05.md ("Principia Discordia ovvero
#   Come trovai la Dea e Cosa le feci Quando la trovai / In cui è Spiegata Assolutamente Qualsiasi Cosa
#   che Valga la Pena di Sapere A proposito Assolutamente di Tutto"), ridotto con adatta.
#   Restano intatti: καλλιχτι, POEE con le frecce, la E e la K, la X cerchiata, tutti i disegni.
# REFUSI CORRETTI: nessuno
# NdT ESCLUSE: nessuna
# FONT: titolo EB Garamond corsivo nero; "PERCHÉ SIAMO QUI?", CONOSCENZA SOPPRESSA, titoletti, riquadro
#   Old Standard; domanda sulla Piramide in Russo One (OFL, aggiunto in strumenti/font: il più vicino al
#   bastone squadrato dell'originale); "Sì," Kalam Bold; righe "Mago Mentale" Oswald; scalini Jost;
#   RATED Jost Bold; "LA DEA ERIS PREVALE" Jost Italic (OFL, aggiunto come Jost-Italic-VF.ttf).
# La pagina è stampata ruotata di 90°: testi con rotazione -90. Le lettere sono cancellate con
#   rettangoli (e strisce sottili dove toccano raggi o cornici) calcolati sui soli tratti delle
#   lettere: i raggi e le cornici non sono toccati.
