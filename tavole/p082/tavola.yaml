    righe:
      - "ENTRO I PROSSIMI CINQUANTA-CINQUE GIORNI RICEVERAI"
      - "TRENTAMILACENTO LIBBRE DI CATENE!"
      - "Nel frattempo - pianta i tuoi semi."

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    interlinea: 60
    x: 183
    y: 1016
    righe:
      - "Se molte delle persone che ricevono questa lettera"
      - "pianteranno pochi semi, e molte persone ricevono"
      - "questa lettera, allora molti semi saranno piantati."
      - "Pianta i tuo semi."

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    interlinea: 60
    colonne: 51
    x: 183
    y: 1316
    testo: >-
      Nei parchi. Negli appezzamenti. Fioriere pubbliche. Posti remoti.
      Municipi. Dovunque. In qualsiasi momento. Oppure avvia una piantagione
      nel tuo guardaroba (ma prima documentati su questo). Per una semina
      occasionale, la soluzione migliore è immergere in acqua per un giorno e
      piantare in gruppi di cinque a circa mezzo pollice di profondità. Non
      preoccuparti troppo del tempo, sanno quando il tempo è inadatto e
      proveranno ad aspettare naturalmente. Non immergerli durante l'inverno.
      I semi sono una forma di vita vigorosa con un forte desiderio di
      crescere e fiorire. Ma alcuni di essi hanno bisogno dell'aiuto della
      gente per cominciare. Pianta i tuoi semi.

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    interlinea: 60
    colonne: 51
    x: 183
    y: 2216
    testo: >-
      Fai poche copie di questa lettera (5 andrebbe bene) e mandale ai tuoi
      amici. Prova a impostarle verso città e stati differenti, addirittura
      altre nazioni. Se non ne hai voglia, passa questa copia a qualcuno a cui
      forse andrebbe.

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    interlinea: 60
    colonne: 51
    x: 183
    y: 2576
    testo: >-
      NON RISPONDE AL VERO

      la leggenda che buttare una lettera di una catena di Sant'Antonio porti
      a conseguenze catastrofiche, abominevoli o oltraggiose. A parte
      ovviamente, dal punto di vista del seme.
