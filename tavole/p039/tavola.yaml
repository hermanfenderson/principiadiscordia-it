    y: 1191
    righe:
      - "Se dovessi scoprire che le tue personali rivelazioni da"
      - "parte della Dea sono diventate sostanzialmente differenti"
      - "dalle rivelazioni di Mal-2, allora forse la Dea ha in"
      - "serbo per te un ruolo da Vescovo e dovresti considerare la"
      - "possibilità di creare una tua propria setta da zero, senza"
      - "ostacolo alcuno. I Vescovi non competono l'un l'altro, e"
      - "rimangono a tutti gli effetti Sacerdoti POEE comunque"
      - "(sempre che io riesca a scovarli). Il succo è che i"
      - "Vescovi stanno tracciando sentieri differenti"
      - "per raggiungere la vetta della montagna"
      - "Erisiana. Consulta la sezione \"Società"
      - "Discordiana\"."

