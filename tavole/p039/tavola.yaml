    righe:
      - "Il Sommo Sacerdote non ha richieste specifiche per i"
      - "suoi Sacerdoti, anche se si aspetta cose abbastanza"
      - "buone da loro. Il Compito del Polipadre è indicare, non"
      - "insegnare. Ogni tanto, può anche ascoltare."

  - font: CourierPrime-Italic.ttf
