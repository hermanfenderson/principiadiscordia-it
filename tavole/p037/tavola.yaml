#   In testo/it il nome "[L'Onnibenevolente Polipadre della Verginità in Oro]" è tra parentesi quadre:
#   qui le parentesi sono rese con la sottolineatura, come nell'originale.
#   "ha un solo scrupolo --che Mal-2 conservi il suo porta chiavi": testo/it seguito alla lettera; l'originale
#   dice che lo scrupolo Mal-2 lo tiene sul portachiavi ("which Mal-2 keeps on his key chain"): da rivedere.
#   "E il PAPA=POEE=." composto come in testo/it (originale "And POEE =POPE=.").
#   Citazione ondulata composta lettera per lettera su due onde parallele (stessa fase e lunghezza d'onda
#   dell'originale, ampiezza minore); la firma "- LICHTENBERG" resta come nell'originale (nome proprio,
#   stessa grafia). Lettere a larghezza piena (scala_x 1).
# REFUSI CORRETTI: "TIl TEMPIO" -> "Il TEMPIO"; "perchè" -> "perché"
# NdT ESCLUSE: nessuna
# Coordinate in pixel sulla scansione a 360 dpi (1827 x 2962).

