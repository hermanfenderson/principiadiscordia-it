# Tavola p037 (originale 00022) — POEE
# Pagina del vecchio sito: 29 (testo/it/29.md)
# STATO: completa
# NUOVE TRADUZIONI: nessuna (citazione di Lichtenberg dall'immagine di Mauro BookIsMirror2.png)
