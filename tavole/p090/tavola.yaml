# Tavola p090 (originale 00075) — Così si concludono i Principia Discordia / L'ultima parola
# Pagina del vecchio sito: 82 (testo/it/82.md)
# STATO: completa
# NUOVE TRADUZIONI (da rivedere):
#   nota a mano verticale "If you think the PRINCIPIA is just a ha-ha, then go read it again." ->
#     "Se pensi che i PRINCIPIA / siano solo un ah-ah, allora / va' a rileggerteli." (sul vecchio sito
#     era l'immagine inglese JustAHaHa.gif);
#   cartiglio "THE TYRANTS FOE. THE PEOPLES FRIEND" -> "IL NEMICO DEI TIRANNI. L'AMICO DEL POPOLO"
#     (vecchio sito: TyrantsFoe.gif in inglese);
#   "ALL RIGHTS REVERSED" -> "TUTTI I DIRITTI ROVESCIATI" (Herman l'aveva lasciato in inglese:
#     "(K) ALL RIGHTS REVERSED - Ristampa se ti va"; la seconda parte è sua);
#   timbro "ANTI-ARISTOTELIAN LEAGUE LIBRARY" -> "BIBLIOTECA DELLA LEGA / ANTI-ARISTOTELICA"
#     (vecchio sito: AntiAristotelian.gif in inglese).
# DIFFERENZE: testo/it/82.md contiene solo titolo, paragrafo e "(K)": le righe "Pubblicato dal Tempio
#   Principale POEE - San Francisco", "SUL SITO DEL FUTURO SPLENDIDO / CANYON DI SANT'ANDREA" e il timbro
#   "UFFICIO DELLA MIA ALTA REVERENZA / MALACLYPSE IL GIOVANE KSC / OPOVIG  SOMMO SACERDOTE POEE" vengono
#   dalla pagina 82 del vecchio sito (storico/sito/html/82.html), traduzione di Herman Fenderson
#   ("OPOVIG" resta com'è, come in p035).
#   "L'ULTIMA PAROLA": traduzione ufficiale di Herman Fenderson parola per parola (sostituisce quella del
#   vecchio sito "UN ULTIMA PAROLA ... un cazzo di peccato che ti sei letto tutta sta roba").
#   Il titolo "PRINCIPIA DISCORDIA ovvero COME SI PERSE L'OCCIDENTE" è in corsivo come nell'originale,
#   con le virgolette del testo italiano. La mela KALLISTI (in greco), il simbolo (K), la torchiera e il
#   numero 00075 restano intatti.
# REFUSI CORRETTI: nessuno
# NdT ESCLUSE: nessuna
# FONT: dattiloscritto IBM Plex Mono 52 (scala_x 0.96, passo 30) e Courier Prime Italic 50; nota a mano
#   Kalam; timbro dell'Ufficio in Jost Regular; timbro della Lega in Jost Medium con effetto timbro;
#   cartiglio in Old Standard Bold, lettera per lettera lungo la curva (cancellazione a strisce sottili
#   attorno alle sole lettere: il disegno non è toccato).
# "L'ULTIMA PAROLA" in 12 righe (originale 13) con scala_x 0.94, per lasciare libero il timbro.
# Coordinate in pixel sulla scansione a 360 dpi (1827 x 2962).

pagina_pdf: 90

