# Tavola p070 (originale 00055) — Eris contempla per 3125 anni (lettera a Fratello Ram)
# Pagina del vecchio sito: 62 (testo/it/62.md)
# STATO: completa
# NUOVE TRADUZIONI (da rivedere; sul vecchio sito l'intestazione era l'immagine ErisContemplates.gif,
#   rimasta in inglese):
#   titolo "ERIS CONTEMPLATES FOR 3125 YEARS" -> "ERIS CONTEMPLA PER 3125 ANNI";
#   riquadro "Pun-jab is Sikh, Sikh, Sikh!" -> "Il Pun-jab è Sikh, Sikh, Sikh!" (il gioco sick/Sikh si perde);
#   carta intestata POEE: "THE PARATHEO-ANAMETAMYSTIKHOOD OF ERIS ESOTERIC (POEE)" -> "L'ORDINE
#   PARATEO-ANAMETAMISTICO DELL'ESOTERICA DI ERIS (POEE)" (come p015); "A Non-prophet Irreligious
#   Disorganization" -> "Una Disorganizzazione Irreligiosa Non-Prophet" (Non-Prophet come in testo/it/47);
#   "MALACLYPSE the Younger, KSC" -> "MALACLYPSE il Giovane, KSC"; "Omnibenevolent Polyfather of Virginity
#   in Gold" -> "Onnibenevolente Polipadre della Verginità nell'Oro" (come p015); "HIGH PRIEST" -> "ALTO
#   SACERDOTE"; "THE ERISIAN MOVEMENT" -> "IL MOVIMENTO ERISIANO"; "HOUSE OF APOSTLES OF ERIS" -> "CASA
#   DEGLI APOSTOLI DI ERIS"; "Official / Surreptitious Business" -> "Affari Ufficiali / Surrettizi" (come
#   p087); "page 1 of 1 pages" -> "pag. 1 di 1 pagine"; "Official Discordian Document Number (if
#   applicable)" -> "Numero di Documento Discordiano Ufficiale (se applicabile)"; "The Golden Apple Corps"
#   -> "Il Corpo della Mela d'Oro"; "House of Disciples of Discordia: The Bureaucracy, Bureau of:" -> "Casa
#   dei Discepoli di Discordia: La Burocrazia, Ufficio di:"; "DOGMAS" -> "DOGMI"; "Council of Episkoposes;
#   Office of High Priesthood, Sect of the POEE" -> "Consiglio degli Episkopos; Ufficio dell'Alto
#   Sacerdozio, Setta della POEE"; "Drawer O" -> "Cassetto O"; "Today's DATE: Day of The Carrot" -> "DATA
#   di oggi: Giorno della Carota"; "Yesterday's DATE: yes" -> "DATA di ieri: sì"; "Originating CABAL:
#   JOSHUA NORTON CABAL" -> "CABALA d'origine: CABALA JOSHUA NORTON"; "TO:" -> "A:"; "Colorado
#   Encrustation" -> "Incrostazione del Colorado" (il nome REV. RAMPANT PANCREAS e la sigla restano);
#   "HAIL ERIS / ALL HAIL DISCORDIA" -> "AVE ERIS / TUTTI SALUTINO DISCORDIA"; "Safeguard this Letter, it
#   may be an IMPORTANT DOCUMENT" -> "Conserva questa Lettera, potrebbe essere un DOCUMENTO IMPORTANTE";
#   "Form No" -> "Mod. N". "Brother Ram," -> "Fratello Ram," (da testo/it).
# DIFFERENZE: timbro curvo "NOT FOR CIRCULATION" -> "NON DIFFONDERE" (la nota del vecchio sito,
#   "*Non diffondere"). "n/a", KALLISTI, sigla del modulo, croce e firma Mal-2, fregi e filetti intatti.
# REFUSI CORRETTI: "dedotto da cià" -> "da ciò"; "coloro che che leggono" -> "coloro che leggono".
# NdT ESCLUSE: [Ndt: "Maitresse"] dopo SIRE, [NdT: "crescita"] dopo RISE, [NdT: "avvilito"] dopo sorE.
# FONT: lettera e campi compilati a macchina in Courier Prime 30 stretto a passo 15 (come l'originale);
#   carta intestata in Jost (grottesco geometrico nero, il più vicino); titolo a mano Architects Daughter;
#   "il Giovane" in UnifrakturMaguntia accanto a MALACLYPSE e KSC originali; le scritte spaziate
#   dell'originale sono rese allargando con scala_x.
# Coordinate in pixel sulla scansione a 360 dpi (1827 x 2962).

