# REFUSI CORRETTI: "DELA VERITA'" -> "DELLA VERITA'"; "nela sabbia" -> "nella sabbia"; "possedendola" -> "possedendolo";
#   "all'Angelo :" -> "all'Angelo:"
# NdT ESCLUSE: nessuna
# La prima riga passa sotto il gambo della croce: "Our" è cancellato con un rettangolo e il gambo è ridisegnato con due filetti.
# Coordinate in pixel sulla scansione a 360 dpi (1827 x 2962).

