# Tavola p014 — Alcuni estratti da un'intervista con Malaclypse il Giovane
# Pagina del vecchio sito: 6 (testo/it/06.md); immagine di Mauro: Annihilation.png
# STATO: completa
# NUOVE TRADUZIONI: nessuna (la scritta "suspended annihilation" segue Annihilation.png: "annichilazione sospesa")
# DIFFERENZE: intestazione: l'originale termina con "& POPE POOP" (firma in coda all'elenco delle testate);
#   il testo italiano lo sposta in testa ("a cura di Papa Pupù dell'..."): composto come nel testo.
#   PAPA PUPU' in maiuscolo perché tutta la coda dell'intestazione è in maiuscolo corsivo nell'originale.
# REFUSI CORRETTI: "un intervista" -> "un'intervista"; "Certo che si!" -> "Certo che sì!"; "perche'" -> "perché";
#   "Malaclypse il giovane": lasciato come nel testo (altrove il testo usa "Malaclipse il Giovane")
# NdT ESCLUSE: nessuna
# Interlinea ridotta (56 invece di 60) e righe vuote tra i gruppi dimezzate: l'italiano è più lungo.
# La riga di "=" è ribattuta più in basso perché l'intestazione italiana occupa sei righe invece di cinque.
# FONT: "annichilazione sospesa" in Jost ExtraBold (OFL, Google Fonts) da /home/claude/work/agente0910/font/,
#   da copiare in strumenti/font per la portabilità (l'originale è un Futura nero, lettere ballerine).
# Coordinate in pixel sulla scansione a 360 dpi (1770 x 2932).

