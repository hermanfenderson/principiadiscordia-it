#   la riga "*La grecità classica" in fondo al testo/it è una didascalia del vecchio sito, non composta;
#   la citazione latina "DIRUIT AEDIFICAT MUTAT QUADRATA ROTUNDUS --Horace" resta com'è.
# REFUSI CORRETTI: "Antici Greci" -> "Antichi Greci"; aggiunto l'asterisco di rimando dopo "Ghiandola Pineale"
