      - "vecchio Tè in una pentola avanzato dalla notte"
      - "precedente, quando egli per sua debolezza si era"
      - "dimenticato di averlo preparato e con ciò lo aveva"
      - "lasciato in infusione per 24 ore. Era scuro e torbido"
      - "ed era intenzione di Hypoc di utilizzare questo"
      - "vecchio Tè diluendolo con acqua. E nuovamente per la"
      - "sua debolezza, così decise senza pensarci su e si"
      - "accinse al lavoro fisico delle preparazioni. Fu allora"
      - "che profondamente immerso nel piacere di quel trip,"
      - "sentì nella sua testa, tutto a un tratto una voce che,"
      - "chiara e con forza, diceva \"è il Tè amaro che ti"
      - "prende tanto.\" Hypoc ascoltò la voce, ma la lotta"
      - "interiore si intensificò, e lo schema, che relazionava"
      - "il suo darsi da fare fisico coi messaggi muscolari e"
      - "ad essi si coordinava e li unificava o addirittura li"
      - "codificava, continuava ad esercitare la sua influenza"
      - "così che Hypoc finì per soccombere a quella pressione"
      - "e ignorò la voce."

