    righe:
      - "   Il secondo concetto che Wiener doveva fissare era"
      - "quello di entropia. La probabilità è un concetto"
      - "matematico, che viene dalla statistica. L'entropia"
      - "viene dalla fisica. Essa è l'asserzione-- verificata"
      - "logicamente e sperimentalmente-- che l'universo, per"
      - 'natura, sta "degradando", andando verso uno stato di'
      - "inerte uniformità priva di forma, materia, gerarchia o"
      - "differenziazione."

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    scala_x: 0.96
    interlinea: 58
    x: 145
    y: 1055
    righe:
      - "   Ovvero che in qualsiasi situazione, meno"
      - "organizzazione, più caos, è in modo schiacciante più"
      - "probabile che una organizzazione più forte o più"
      - "ordine."

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    scala_x: 0.96
    interlinea: 58
    x: 145
    y: 1309
    righe:
      - "   La tendenza dell'entropia ad aumentare in sistemi"
      - "isolati si esprime con la seconda legge della"
      - "termodinamica, forse la più pessimistica e amorale"
      - "delle formulazioni del pensiero umano."

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    scala_x: 0.96
    interlinea: 58
    x: 145
    y: 1563
    righe:
      - "   Essa tuttavia si applica a un sistema chiuso, a"
      - "qualcosa che sia un sistema isolato, non a una singola"
      - "parte. In tale sistema potrebbero esserci parti che"
      - "prendendo la loro energia dal tutto, si stiano muovendo"
      - "almeno temporaneamente nella direzione opposta; in essi"
      - "l'ordine sta aumentando e il caos diminuendo."

  - font: IBMPlexMono-Medium.ttf
    corpo: 52
    scala_x: 0.96
    interlinea: 58
