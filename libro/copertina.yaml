# Testi della copertina.
# Si compone con  python3 strumenti/copertina.py --pagine N --carta crema --variante ocra|bianca

prima:
  timbro: ""   # timbro in diagonale, tolto: ora edizione e traduttore stanno in basso, come a pagina 3
  etichetta: ["EDIZIONE ITALIANA", "TRADOTTO DA HERMAN FENDERSON"]   # versione "spirale"
  # la prima è la tavola p013 ricomposta (strumenti/copertina.py, coordinate della scansione a 360 dpi):
  # titolo più grande, su una riga, nel carattere a riccioli; sottotitolo più piccolo
  togli: ["NON E' POSTA SPAZZATURA", "OVVERO", "Come trovai la Dea",   # righe di p013 da non riportare
          "Una caraffa di vino.", "Un coscio d'agnello", "E tu!", "Accanto a me.", "Che fischi", "nell'oscurità",
          "Non perdetevi tra precetti d'Ordine...", "IL LIBRO DELL'UTERO 1;5", "In cui è Spiegata"]
  cancella:
    - [250, 480, 1600, 645]     # il "PRINCIPIA DISCORDIA" gotico (e il granello di polvere sopra)
    - [45, 1455, 1165, 2568]    # croce e statua originali: vengono incollate più in basso
    - [590, 436, 630, 475]      # granelli di polvere della scansione
    - [40, 1214, 84, 1254]
    - [134, 1376, 175, 1417]
    - [19, 2268, 64, 2308]
  immagini:
    # croce e statua ritagliate dalla scansione di p013 e abbassate di 285 px, perché la prima abbia
    # margini in alto e in basso simili a quelli della quarta
    - {file: tavole/apparato/croce-p013.png, x: 52, y: 1745}
    - {file: tavole/apparato/statua-p013.png, x: 730, y: 2425, larghezza: 860}   # centrata sotto la scritta
  aggiungi:
    - {font: MysteryQuest-Regular.ttf, corpo: 200, grassetto: 1, allinea: centro, x: 885, y: 600,
       righe: ["Principia Discordia"]}
    - {font: Jost-Bold.ttf, corpo: 62, allinea: centro, x: 885, y: 780, righe: ["OVVERO"]}
    - {font: MysteryQuest-Regular.ttf, corpo: 124, grassetto: 1, interlinea: 132, allinea: centro, x: 885, y: 980,
       righe: ["Come trovai la Dea", "e Cosa le feci", "Quando la trovai"]}
    - {font: Jost-Bold.ttf, corpo: 50, interlinea: 62, allinea: centro, x: 883, y: 1470,
       righe: ["In cui è Spiegata", "Assolutamente Qualsiasi Cosa", "che Valga la Pena di Sapere",
               "A proposito Assolutamente di Tutto"]}
    # edizione e traduttore a destra delle mezzelune, come nel frontespizio di pagina 3
    - {font: Jost-Bold.ttf, corpo: 80, allinea: centro, x: 1160, y: 2125, righe: ["EDIZIONE ITALIANA"]}
    - {font: Jost-Regular.ttf, corpo: 52, allinea: centro, x: 1160, y: 2220,
       righe: ["traduzione, prefazione alla prefazione e note di"]}
    - {font: Jost-Bold.ttf, corpo: 72, allinea: centro, x: 1160, y: 2310, righe: ["HERMAN FENDERSON"]}

frontespizio:   # pagine 1 e 3 del libro (strumenti/pagine_apertura.py)
  autore: "MALACLYPSE IL GIOVANE"
  edizione: "EDIZIONE ITALIANA"
  traduzione: "traduzione, prefazione alla prefazione e note di"
  traduttore: "HERMAN FENDERSON"

dorso:
  titolo: "Principia Discordia"
  font: MysteryQuest-Regular.ttf   # il carattere a riccioli della prima
  autore: "Malaclypse il Giovane · edizione italiana a cura di Herman Fenderson"

quarta:
  citazione:
    - "-- Sei veramente serio o cosa?"
    - "-- Qualche volta prendo l'umorismo seriamente. Qualche volta prendo la serietà umoristicamente. In entrambi i casi, è irrilevante."
  fonte_citazione: "Malaclypse il Giovane, intervistato"
  presentazione: >-
    Sul finire degli anni Cinquanta, in un bowling aperto tutta la notte alla
    periferia di Los Angeles, due giovani californiani ricevettero la visita di
    Eris, Dea del Caos, della Discordia e della Confusione. Ne nacque il
    Discordianesimo: una religione travestita da scherzo, o uno scherzo
    travestito da religione.


    I Principia Discordia ne sono il testo sacro: un collage di dattiloscritti,
    timbri, ritagli e disegni rubacchiati, fotocopiato e ristampato dal 1963 con
    un'unica avvertenza: Ristampa quel che ti pare. Ne sono discesi la trilogia
    Illuminatus!, mezza mitologia della controcultura e il copyleft, prima ancora
    che avesse un nome.


    Questa edizione riproduce in facsimile l'edizione Loompanics del 1980, con
    l'introduzione di Robert Anton Wilson, la postfazione di Greg Hill e la
    Quinta Edizione: ogni pagina ricomposta in italiano, scritta per scritta.
  didascalia: "Herman Fenderson scruta le proprie prospettive nel medio termine..."
  traduttore: >-
    Herman Fenderson, apprendista patafisico, cominciò a tradurre i Principia
    molti anni fa e li ha finiti soltanto ora, come si conviene. Divide il suo
    tempo tra una città eterna e una che porta il nome di un gioco da tavolo.


    Interrogato in proposito, nega tutto.
  piede:
    - "(K) All Rites Reversed -- Ristampa quel che ti pare."
    - "Traduzione italiana con licenza Creative Commons BY-SA 4.0. Il testo integrale è libero su principiadiscordia.hermanfenderson.com"
